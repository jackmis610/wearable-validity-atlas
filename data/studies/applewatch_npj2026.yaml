id: applewatch_npj2026
citation: "The accuracy of Apple Watch measurements: a living systematic review and meta-analysis. npj Digital Medicine (living, updated 2026)."
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12823594/
year: 2026
tier: systematic_review
independent: true
pooled_studies: 82             # 82 studies, 430,052 participants (all metrics)
pooled_participants: 430052
notes: "Apple-Watch-specific living meta-analysis; energy expenditure remained the weakest metric. Pooled total is across all metrics; no EE-specific count assigned to this measurement."
measurements:
  - device: apple_watch
    claim: energy_expenditure
    condition: mixed activity
    criterion: indirect_calorimetry
    reported: { pct_within_band: 9 }   # ~9% of comparisons within 3%
