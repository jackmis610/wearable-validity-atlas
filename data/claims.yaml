# Catalogue of physiological claims wearables make.
#
# Every claim here is a physical quantity with an external gold-standard
# criterion, so it can be assessed for measurement accuracy. gold_criteria lists
# the reference methods that count as a true criterion.
#
# Out of scope by design: proprietary composite scores (Readiness, Recovery,
# Strain, Stress, Body Battery). They have no external criterion in physical
# units, so there is nothing to validate them *against* -- assessing their
# "accuracy" is a category error. See README / METHODOLOGY ("What we don't grade").

- id: heart_rate
  label: Heart rate
  gold_criteria: [ecg, chest_strap_ecg]

- id: vo2max
  label: VO2max (cardiorespiratory fitness)
  gold_criteria: [cpet_metabolic_cart, douglas_bag]

- id: hrv
  label: Heart rate variability
  gold_criteria: [ecg, chest_strap_ecg]

- id: spo2
  label: Blood oxygen (SpO2)
  gold_criteria: [co_oximetry, arterial_blood_gas]

- id: blood_pressure
  label: Blood pressure (cuffless)
  gold_criteria: [arterial_line, validated_cuff]

- id: energy_expenditure
  label: Energy expenditure (calories)
  gold_criteria: [indirect_calorimetry, doubly_labeled_water]

- id: steps
  label: Step count
  gold_criteria: [direct_observation, video]

- id: sleep_duration
  label: Total sleep time
  gold_criteria: [psg]

- id: sleep_stages
  label: Sleep staging
  gold_criteria: [psg]
