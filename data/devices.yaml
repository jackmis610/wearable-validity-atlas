# Catalogue of devices and the claims each one MARKETS.
#
# `markets` drives the "Grade D" logic: if a device markets a claim but no
# independent validation study exists for it, the cell is graded D
# (unvalidated-but-marketed) rather than silently omitted. Proprietary composite
# scores (Readiness, Recovery, Strain, etc.) are intentionally not listed --
# they are out of scope (no criterion to validate against).

- id: apple_watch
  label: Apple Watch
  vendor: Apple
  markets: [heart_rate, vo2max, hrv, spo2, energy_expenditure, steps, sleep_duration, sleep_stages]

- id: garmin_fenix
