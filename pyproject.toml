[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wearvalid"
version = "0.1.0"
description = "An auditable validity grading engine for consumer wearable health claims"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["pyyaml>=5.4"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
wearvalid = "wearvalid.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
